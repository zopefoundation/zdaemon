# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/buildout-recipe
[meta]
template = "buildout-recipe"
commit-id = "7cab96bb"

[python]
with-pypy = true
with-sphinx-doctests = false
with-macos = false
with-windows = false
with-future-python = false
with-docs = false
with-free-threaded-python = false

[coverage]
fail-under = 79

[coverage-run]
additional-config = ["data_file = $COVERAGE_HOME.coverage"]
omit = ["*/__main__.py"]

[tox]
coverage-setenv = [
    "COVERAGE_PROCESS_START={toxinidir}/pyproject.toml",
    "COVERAGE_HOME={toxinidir}/",
]

[manifest]
additional-rules = [
    "recursive-include src *.conf",
    "recursive-include src *.rst",
    "recursive-include src *.xml",
]
